<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>패턴랩 · AI 팀 리그</title><style>
:root{--bg:#f3f6f4;--ink:#183d32;--muted:#6d7e76;--green:#185c4b;--line:#dbe5de;--warn:#875c17}*{box-sizing:border-box}body{margin:0;font:14px/1.65 system-ui,sans-serif;color:var(--ink);background:var(--bg)}header{background:white;border-bottom:1px solid var(--line);padding:20px 28px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}header strong{font-size:19px;letter-spacing:-.03em}a{color:var(--green)}header nav{display:flex;gap:18px;flex-wrap:wrap}main{max-width:1300px;margin:auto;padding:22px 24px 60px}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 20px;padding-bottom:5px}button,.link{padding:10px 15px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--green);font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}button:disabled{opacity:.45;cursor:not-allowed}button.primary,.tabs button.active{background:var(--green);color:white;border-color:var(--green)}button.danger{color:#a33f36}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px;min-width:0}.hero{background:var(--green);color:white;border-radius:18px;padding:26px;margin-bottom:18px}.hero p{color:#d7e9df}h1{font-size:28px;letter-spacing:-.04em;margin:5px 0 12px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:10px 0}p,small,.muted{color:var(--muted)}.notice{padding:15px;border-radius:10px;background:#fff3db;color:var(--warn);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.role{border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.row,.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.row{justify-content:space-between}.controls>div,.two>*,.grid>*{min-width:0}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}label.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}input,select,textarea{font:inherit;color:var(--ink);max-width:100%;border:1px solid var(--line);background:white;border-radius:8px;padding:10px}input:not([type=checkbox]),select,textarea{width:100%}input[type=checkbox]{margin-top:4px}textarea{min-height:85px}small,code{overflow-wrap:anywhere}.tag{display:inline-block;border-radius:20px;background:#eaf2ed;color:var(--green);padding:4px 9px;font-size:11px}.number{font-size:25px;font-weight:750}.metric{padding:17px;border:1px solid var(--line);border-radius:12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}pre{font-size:12px;background:#f6f8f6;border-radius:9px;padding:12px;overflow:auto;max-height:430px}details{margin:10px 0}summary{cursor:pointer;font-weight:650}#message{position:sticky;top:0;z-index:5;background:#e8f3ec;padding:13px 18px;border:1px solid #bfd8c9;border-radius:10px;white-space:pre-wrap;margin-bottom:14px}#message:empty{display:none}#message.error{background:#fff0ed;border-color:#e7c4be;color:#a13b30}.hidden{display:none!important}.chart{height:180px;background:#f6f9f7;border-radius:10px;margin-top:18px;overflow:hidden}.chart svg{width:100%;height:100%}footer{padding-top:15px}#content{min-width:0}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:500px){main{padding:16px 12px}.panel,.hero{padding:17px}header{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:24px}.controls{align-items:stretch;flex-direction:column}}
</style></head><body><header><strong>패턴랩 <span class="muted">/ AI TEAM LEAGUE</span> <span class="tag" id="runningBuild">2.0</span></strong><nav><a href="/ai">AI 회의·보고서</a><a href="/league">기준 전략 연구실</a><a href="/">기존 보유·거래 관리</a></nav></header><main><div class="tabs" role="tablist"><button data-tab="home">운영 홈</button><button data-tab="settings">① API 연결 설정</button><button data-tab="market">② 시장 데이터</button><button data-tab="paper">③ 모의거래·성적표</button><button data-tab="ledger">원장·기존 데이터</button><button data-tab="review">승강 심사</button><button data-tab="backup">백업·복구</button></div><div id="message" role="status" aria-live="polite"></div><div id="content"></div><footer><small>실제 주문 기능 없음 · 모든 모의 원장은 실제 계좌와 분리됩니다. 소프트웨어 예산은 공급자 결제 하드캡이 아닙니다.</small></footer></main>
<script>
'use strict';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(x));const pct=x=>(Number(x)*100).toFixed(2)+'%';const roles={TEAM_A:'A · 추세·모멘텀',TEAM_B:'B · 패턴·통계',TEAM_C:'C · 국면·위험',TEAM_D:'D · 도전자',MANAGER_EVAL:'팀장 후보 심사',RED:'레드팀',DIRECTOR:'총괄 관리자',AUDIT_AI:'독립 AI 감사'};let state,tab='home',csrf='',busy=false,restoreContent='',lastDryRun=null,selectedConnector='kis';
async function api(path,payload){const r=await fetch(path,payload?{method:'POST',headers:{'Content-Type':'application/json','X-Pattern-Lab-Token':csrf},body:JSON.stringify(payload)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'작업 실패');return d;}
async function load(){state=await api('/api/app/state');csrf=state.csrf;render();}
function notify(text,error=false){$('message').className=error?'error':'';$('message').textContent=text;}
async function task(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);notify('처리 중…');try{const result=await fn();if(result!==false)await load();}catch(e){notify(e.message,true);}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);refreshFeedChoices();}}
async function fileData(input,maxBytes=10000000){const f=$(input).files[0];if(!f)throw Error('파일을 선택하세요.');if(f.size>maxBytes)throw Error('파일 크기 한도를 초과했습니다.');const content=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(f);});return {filename:f.name,content};}
function options(items,label){return items.map(i=>`<option value="${esc(i.id)}">${esc(label(i))}</option>`).join('');}
function jsonDetails(title,data){return `<details><summary>${esc(title)}</summary><pre>${esc(JSON.stringify(data,null,2))}</pre></details>`;}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const op=state.operations; $('runningBuild').textContent='2.0 · '+(state.build||'이전 서버');let html='';
if(tab==='home'){const ready=state.ai.configuration.ready,latest=op.calendar.latest_closed;html=`<div class="hero"><span class="tag">운영 중심 · 연구/모의 모드</span><h1>설정부터 기록, 검증까지 한 곳에서.</h1><p>API 키 등록 → 실제 모델 확인 → 두 시세 공급원 대조 → AI 회의 → 모의 운용 순서로 시작하세요.</p></div><div class="grid"><div class="metric"><small>Gemini 연결 설정</small><div class="number">${ready?'등록됨':'설정 필요'}</div><small>실제 생성 성공과 별개</small></div><div class="metric"><small>AI 회의</small><div class="number">${state.ai.runs.length}건</div></div><div class="metric"><small>최근 종료 거래일</small><div class="number">${esc(latest?.date||'캘린더 필요')}</div></div><div class="metric"><small>운영 기록 무결성</small><div class="number">${op.audit.valid?'검사 통과':'검사 실패'}</div></div></div><section class="panel" style="margin-top:18px"><h2>운영 제어</h2><div class="notice">긴급 중지: ${op.emergency.enabled?'활성 · 신규 호출/모의 체결 중단':'해제됨'}</div><div class="controls"><select id="emergencyReason"><option value="operator_pause">운영자 일시 중지</option><option value="key_exposure">키 유출 의심</option><option value="ledger_exposure">원장 노출 의심</option><option value="source_corruption">원본 손상 의심</option><option value="order_path">주문 경로 발견</option></select><button id="emergencyStop" class="danger">긴급 중지</button><button id="emergencyResume">원인 확인 후 중지 해제</button></div><h2 style="margin-top:24px">일일 회의</h2><p>미국 거래일의 장 종료 15분 후, 검증된 최신 시세가 있을 때만 하루 한 번 회의를 시작합니다. 서버 창을 닫으면 자동 운영도 멈춥니다. 모의 주문은 취소 조건을 확인하고 별도 접수합니다.</p><label class="check"><input type="checkbox" id="scheduleEnabled" ${op.schedule.enabled?'checked':''}>자동 회의 활성화</label><label for="scheduleSymbol">종목</label><input id="scheduleSymbol" value="${esc(op.schedule.symbol||'SOXL')}" maxlength="12"><div class="controls" style="margin-top:12px"><button id="saveSchedule" class="primary">자동 운영 설정 저장</button><button id="tick">지금 운영 조건 확인</button><a class="link" href="/ai">AI 회의 열기</a></div>${jsonDetails('최근 운영 보류·오류',op.scheduler_notices)}</section><section class="panel"><h2>진행 중 회의</h2>${state.ai.runs.filter(r=>r.state==='running').map(r=>`<div class="row"><span>${esc(r.id.slice(0,12))} · ${r.steps.filter(s=>s.state==='completed').length}/12</span><button data-cancel="${r.id}" class="danger">다음 호출부터 중단</button></div>`).join('')||'<p>진행 중인 회의가 없습니다.</p>'}<button id="refresh">전체 상태 새로고침</button></section>`;}
if(tab==='settings'){const v=state.settings.values;html=`<section class="panel"><h1>API 연결 설정</h1><p>여기에서 역할별 키를 직접 등록할 수 있습니다. 등록 후 키 값은 다시 표시하지 않습니다. 빈 칸으로 저장하면 기존 키를 유지합니다.</p><div class="notice" id="storageNotice">${esc(state.settings.error||state.settings.note)}</div>${state.settings.error?`<label class="check"><input id="resetStoreConfirmed" type="checkbox">암호화 원본을 별도 보존한 뒤 연결 저장소를 초기화합니다. 환경의 보안 값은 유지됩니다.</label><button id="resetStore" class="danger">원본 보존 후 연결 저장소 재설정</button>`:''}<button id="saveSettingsTop" class="primary">설정·키 저장</button><div class="two"><div><label for="globalModel">회의에 사용할 Gemini 모델 (8개 역할의 기본값)</label><input id="globalModel" list="modelOptions" placeholder="API 키 저장 → 아래 모델 목록 불러오기 → 모델 선택" value="${esc(v.PL_GEMINI_MODEL||'')}"><datalist id="modelOptions"></datalist><p>① API 키를 저장하세요. ② 모델 목록을 불러오세요. ③ 아래 목록에서 모델을 선택하고 설정을 저장하세요.</p><label for="modelSelect">조회된 모델 선택</label><select id="modelSelect"><option value="">먼저 모델 목록을 불러오세요</option></select><label for="modelRole">모델을 조회할 역할</label><select id="modelRole">${Object.entries(roles).map(([r,n])=>`<option value="${r}">${esc(n)}</option>`).join('')}</select><button id="models" style="margin-top:10px">등록된 키로 실제 모델 목록 불러오기</button><small id="modelsMessage"></small></div><div><label for="budget">월 예산 (최대 20,000원)</label><input id="budget" type="number" min="1" max="20000" value="${esc(v.PL_MONTHLY_BUDGET_KRW||'20000')}"><label for="inputRate">입력 100만 토큰당 원화 단가</label><input id="inputRate" type="number" min="0" step="any" value="${esc(v.PL_INPUT_KRW_PER_MILLION??'')}"><label for="outputRate">출력·추론 100만 토큰당 원화 단가</label><input id="outputRate" type="number" min="0" step="any" value="${esc(v.PL_OUTPUT_KRW_PER_MILLION??'')}"><label class="check"><input id="freeConfirmed" type="checkbox">단가 0 입력 시, 모든 해당 프로젝트의 실제 무료 자격을 확인했습니다.</label></div></div></section><div class="grid">${state.settings.roles.map(r=>`<section class="role"><span class="tag">${r.configured?'키 등록됨':'미등록'}${r.managed_by_environment?' · 환경에서 관리':''}</span><h3>${esc(roles[r.role])}</h3><label for="key-${r.role}">API 키</label><input id="key-${r.role}" type="password" autocomplete="new-password" spellcheck="false" placeholder="${r.configured?'새 키 입력 시 교체':'키를 여기에 입력하세요'}" ${r.managed_by_environment?'disabled':''}><details><summary>프로젝트·모델·실제 한도</summary><label>Google 프로젝트 ID</label><input data-public="PL_${r.role}_PROJECT_ID" value="${esc(v['PL_'+r.role+'_PROJECT_ID']||'')}"><label>개별 모델 (빈 칸은 공통 모델)</label><input data-public="PL_${r.role}_MODEL" value="${esc(v['PL_'+r.role+'_MODEL']||'')}">${['RPM','TPM','RPD'].map(k=>`<label>${k} · 실제 확인한 한도</label><input data-public="PL_${r.role}_${k}" type="number" min="1" value="${esc(v['PL_'+r.role+'_'+k]||'')}">`).join('')}</details><label class="check"><input type="checkbox" data-delete="${r.role}" ${r.managed_by_environment?'disabled':''}>등록된 키 삭제</label></section>`).join('')}</div><section class="panel" style="margin-top:18px"><h2>한국투자 시세 연결 (선택)</h2><div id="kisSavedStatus" role="status" class="notice">${state.settings.market_credentials.KIS_APPKEY&&state.settings.market_credentials.KIS_APPSECRET?'두 키가 등록되어 있습니다. 보안을 위해 저장된 키는 입력칸에 표시하지 않습니다.':'App Key와 App Secret을 둘 다 입력하고 한국투자 키 저장을 누르세요.'} 저장 여부와 실제 인증 성공은 별개입니다.</div><p>기존 시세 조회용 키입니다. 주문·계좌 자동매매 기능은 연결하지 않습니다. ${state.legacy_kis_file_present?'기존 KIS 파일이 감지되었습니다. 원본은 보존되며, 필요하면 보안 저장소에 다시 등록하세요.':''}</p><div class="two"><div><label>App Key · ${state.settings.market_credentials.KIS_APPKEY?'등록됨':'미등록'}</label><input id="kisKey" type="password" autocomplete="new-password" placeholder="빈 칸이면 저장된 App Key 유지"></div><div><label>App Secret · ${state.settings.market_credentials.KIS_APPSECRET?'등록됨':'미등록'}</label><input id="kisSecret" type="password" autocomplete="new-password" placeholder="빈 칸이면 저장된 App Secret 유지"></div></div><div class="controls" style="margin-top:16px"><button id="saveKis" class="primary">한국투자 키만 저장</button><button id="checkKis">저장된 한국투자 키로 인증 확인</button></div><p>한국투자 키만 저장하면 위 Gemini 모델·요금 설정과 관계없이 저장됩니다. 확인 버튼은 인증만 수행합니다.</p><button id="saveSettings" class="primary" style="margin-top:16px">연결 설정과 키 저장</button><p>다른 키가 다른 프로젝트에 속하는지는 Google에서 직접 확인해야 합니다. 모델 목록 조회는 무료 자격·실제 생성 성공을 증명하지 않습니다.</p></section>`;}
if(tab==='market'){html=`<section class="panel"><h1>시장 데이터 · 두 공급원 대조</h1><p>원본 CSV는 해시와 함께 보존합니다. 공급원·가격 기준·분할 이벤트를 확인하고, 최근 종료 거래일의 공통 60봉을 0.5% 허용 차이로 대조합니다.</p><div class="two"><div><h3>실제 공급원 연결</h3><p>등록·활성화는 설정 저장입니다. 아래 갱신 버튼을 눌러야 실제 시세를 가져옵니다. 갱신 실패는 API 키가 지워졌다는 뜻이 아닙니다.</p><label>공급원</label><select id="connectorProvider"><option value="kis">한국투자 Open API</option><option value="yahoo">Yahoo Finance · 추가 API 키 없음</option><option value="stooq">Stooq 공개 CSV · 자동 조회 제한 가능</option></select><p id="connectorHelp"></p><label>종목</label><input id="connectorSymbol" value="SOXL"><label>공급원의 실제 가격 기준</label><select id="connectorBasis"><option value="">먼저 공급원 정책을 확인하세요</option><option value="split-adjusted">분할 조정 주가</option><option value="unadjusted">비조정 주가</option></select><label class="check"><input id="connectorTerms" type="checkbox">해당 공급원의 이용 조건과 분할 조정 정책을 확인했습니다.</label><button id="enableConnector">공급원 등록·활성화</button><button id="fetchConnector">등록된 공급원에서 갱신</button><button id="disableConnector">이 공급원 연결 중지</button>${jsonDetails('등록된 연결',state.connectors)}</div><div><h3>공급원 CSV 가져오기</h3><label>CSV 파일 (date,open,high,low,close)</label><input id="marketFile" type="file" accept=".csv"><label>실제 공급원 식별자</label><input id="marketProvider" placeholder="예: 공급업체 이름"><label>종목</label><input id="marketSymbol" value="SOXL"><label>가격 기준</label><select id="marketBasis"><option value="split-adjusted">분할 조정 주가</option><option value="unadjusted">비조정 주가</option></select><label>수집 시각</label><input id="marketAsOf" type="datetime-local"><label>분할 이벤트 JSON (없음을 확인한 경우 {})</label><textarea id="splits">{}</textarea><label class="check"><input id="marketTerms" type="checkbox">사용 조건·출처·조정 정책·분할 이력을 확인했습니다.</label><button id="importMarket">원본 보존 후 가져오기</button></div></div></section><section class="panel"><h2>두 피드 검증</h2><p id="comparisonHelp" role="status"></p><div class="two"><div><label>공급원 A</label><select id="feedA">${options(comparisonFeeds(op.feeds),f=>`${f.provider} · ${f.symbol} · ${f.cutoff}`)}</select></div><div><label>공급원 B</label><select id="feedB">${options(comparisonFeeds(op.feeds),f=>`${f.provider} · ${f.symbol} · ${f.cutoff}`)}</select></div></div><button id="compare" class="primary" style="margin-top:12px">최신 시세 정합성 검증</button>${op.comparisons.slice(-5).reverse().map(c=>`<div class="notice"><strong>${c.passed?'정합성 정책 통과':'승인 보류'}</strong> · ${esc(c.cutoff)}<br>${esc(c.issues.join(' / '))}${jsonDetails('차이 상세',c)}</div>`).join('')}</section>`;}
if(tab==='paper'){const p=op.portfolio;html=`<section class="panel"><h1>연속 모의거래 원장 · 성적표</h1><p>각 팀 $10,000으로 시작합니다. 검토한 목표 수량을 익일 시가에 모의 체결하고 실제 현금·보유량을 이어갑니다. 편도 수수료 $1·슬리피지 0.1%를 적용하며, 독립 기간 수익률을 복리 합성하지 않습니다.</p><label>접수할 완료 회의</label><select id="paperRun">${options(state.ai.runs.filter(r=>r.state==='completed'),r=>`${r.events[0]?.payload.symbol} · ${r.events[0]?.payload.cutoff} · 재심 ${r.attempt}`)}</select><label class="check"><input id="conditionsChecked" type="checkbox">모든 팀의 취소 조건을 확인했으며 연구용 모의 원장에 접수합니다.</label><button id="queuePaper" class="primary">익일 모의 주문 접수</button><label>검증된 후속 가격 스냅샷</label><select id="settleSnapshot">${options(state.snapshots,s=>`${s.symbol} · ${s.cutoff} · ${s.source}${s.synthetic?' · 합성':''}`)}</select><button id="settle">후속 가격으로 모의 원장 정산</button><div class="notice">이중 시세가 미검증·지연되면 체결을 보류합니다. 지나간 시가에 사후 접수한 실험은 과거 재현으로 표시하며 미래 실적으로 간주하지 않습니다.</div></section><section class="panel"><h2>현재 성적</h2><div class="scroll"><table><thead><tr><th>팀·기준선</th><th>현금</th><th>보유</th><th>자산</th><th>순수익률</th><th>MDD</th><th>수수료</th></tr></thead><tbody>${p.scores.map(s=>`<tr><td>${esc(s.book)}</td><td>${money(s.cash)}</td><td>${s.qty}</td><td>${money(s.equity)}</td><td>${pct(s.net_return)}</td><td>${pct(s.mdd)}</td><td>${money(s.fees)}</td></tr>`).join('')||'<tr><td colspan="7">아직 모의 체결이 없습니다.</td></tr>'}</tbody></table></div><div id="equityChart" class="chart"></div>${jsonDetails('주문·거부·체결 원장',p.orders.concat(p.fills))}${jsonDetails('일별 자산 기록',p.marks)}</section>`;}
if(tab==='ledger'){html=`<section class="panel"><h1>원장 감사 · 기존 데이터 이관</h1><p>이 기능은 선택입니다. 과거 파일이 없어도 연구·모의 개발은 가능합니다. 실계좌 기준 전략 승인에는 전체 원장과 증권사 대조가 필요합니다. 원본을 지우거나 임의 매도행을 만들지 않습니다.</p><div class="two"><div><h3>체결 CSV (키움 2행/3행·정규화)</h3><p>필수 열: date,symbol,side,qty,price. 선택: fees,tax,trade_id,order_date,settlement_date. side는 BUY/SELL입니다. UTF-8·CP949와 키움 주문·체결/거래·정산 형식을 지원합니다. 수수료 미포함 형식의 0은 잠정값이므로 별도 검산하세요.</p><input id="ledgerFile" type="file" accept=".csv"><button id="importLedger">원본 보존·원장 검산</button></div><div><h3>기존 패턴랩 전체 JSON</h3><input id="migrationFile" type="file" accept=".json"><button id="previewMigration">백업 보존·드라이런 대조</button>${op.migrations.map(m=>`<div><small>${esc(m.source.slice(0,12))} · 오류 ${m.issues.length}</small><button data-migrate="${m.source}">드라이런 확인 후 이관 확정</button></div>`).join('')}</div></div></section><section class="panel"><h2>검산 결과</h2>${op.ledgers.slice(-8).reverse().map(l=>`<details class="role"><summary>${esc(l.id.slice(0,12))} · ${l.accepted}건 · 오류/후보 ${l.issues.length}</summary><pre>${esc(JSON.stringify({positions:l.positions,total_fees:l.total_fees,total_taxes:l.total_taxes,format:l.format_metadata,issues:l.issues},null,2))}</pre>${l.issues.length&&l.issues.every(i=>['duplicate_candidate','date_difference_candidate'].includes(i.kind))?`<div id="review-${l.id}">${l.issues.map(i=>`<label>원본 ${i.line}행 · ${i.other_line}행과 중복 후보</label><select data-review="${i.line}"><option value="">원본 확인 후 선택</option value="separate-fill">실제로 별도 체결</option><option value="exclude-duplicate">중복으로 확인하여 계산 제외</option></select>`).join('')}<button data-ledger-review="${l.id}">검토 판단을 새 버전으로 기록</button></div>`:''}${!l.issues.length?`<label>증권사 기준 JSON · 수량/평단/실현손익</label><textarea id="refs-${l.id}" placeholder='{"SOXL":{"qty":38,"avg":164.2326,"realized":0}}'></textarea><label>별도 검산한 총수수료</label><input id="fees-${l.id}" type="number" step="any"><label>별도 검산한 총세금 (없으면 0)</label><input id="taxes-${l.id}" type="number" value="0" step="any"><label class="check"><input id="full-${l.id}" type="checkbox">전체 체결 이력이며 원본 누락 여부를 확인했습니다.</label><label class="check"><input id="independent-${l.id}" type="checkbox">실현손익·수수료를 증권사 기준으로 별도 검산했습니다.</label><button data-confirm-ledger="${l.id}">증권사 기준과 대조·확정</button>`:''}</details>`).join('')||'<p>아직 원본이 없습니다. 게이트는 미완료로 유지됩니다.</p>'}${jsonDetails('사용자 확인 대조 이력',op.ledger_confirmations)}</section>`;}
if(tab==='review'){html=`<section class="panel"><h1>챔피언·도전자 승강 심사</h1><p>평가 기준을 지금 고정하고 이후의 실제 미래 표본만 심사합니다. 최소 6개월·30개 비중첩 표본·3개 국면이 부족하면 유예합니다. 승격은 자동으로 적용하지 않습니다.</p><div class="two"><div><label>최소 개월</label><input id="reviewMonths" type="number" min="6" max="120" value="6"><label>최소 독립 표본</label><input id="reviewSamples" type="number" min="30" value="30"></div><div><label>최소 시장 국면</label><input id="reviewRegimes" type="number" min="3" max="6" value="3"><label>평가 기간</label><select id="reviewHorizon"><option value="20">20거래일</option><option value="10">10거래일</option><option value="5">5거래일</option></select></div></div><button id="freezeRules" class="primary" style="margin-top:12px">새 평가 기준 버전 고정</button><label>고정된 평가 기준</label><select id="reviewRule">${options(op.rules,r=>`${r.created_at.slice(0,10)} · ${r.minimum_months}개월 · ${r.minimum_samples}표본 · ${r.horizon}거래일`)}</select><button id="reviewNow">현재 표본으로 심사</button>${op.reviews.slice(-5).reverse().map(r=>`<div class="notice">${r.status==='recommended'?'승격 권고':'심사 유예'} · ${r.samples}표본 · ${esc(r.reasons.join(' / '))}${r.status==='recommended'&&r.replace_team?`<button data-promote="${r.id}">권고 확인 후 팀 전략 교체 적용</button>`:''}${(r.leader_candidates||[]).map(t=>`<button data-promote-leader="${r.id}" data-team="${t}">${t}팀 그림자 후보 승격 적용</button>`).join('')}${jsonDetails('심사 근거',r)}</div>`).join('')}${jsonDetails('현재 전략 프로필',op.profiles)}</section>`;}
if(tab==='backup'){html=`<section class="panel"><h1>백업 · 복구 · 기록 재생</h1><p>세 DB와 비밀이 아닌 설정을 백업합니다. API 키·보안 저장소는 내보내지 않습니다. 복원 전 현재 상태의 백업을 자동 생성합니다. AI 회의 진행 중에는 복원을 보류합니다.</p><div class="controls"><button id="backup" class="primary">전체 데이터 백업 생성</button><button id="replay">불변 기록 무결성·재생 확인</button></div><h3>저장된 백업</h3>${state.backups.map(b=>`<p><a href="/api/app/backup/download?name=${encodeURIComponent(b.name)}">${esc(b.name)}</a> · ${(b.bytes/1024).toFixed(1)}KB</p>`).join('')||'<p>아직 백업이 없습니다.</p>'}<h3>백업 ZIP 복원</h3><input id="restoreFile" type="file" accept=".zip"><button id="inspectBackup">복원 파일·해시 먼저 확인</button><label class="check"><input id="restoreConfirmed" type="checkbox">아래 검사 결과를 확인했고 현재 데이터를 이 백업으로 복원합니다.</label><button id="restore" class="danger">현재 상태 백업 후 복원</button><div id="restorePreview"></div>${jsonDetails('운영 무결성',op.audit)}</section>`;}
$('content').innerHTML=html;bind();if(tab==='market')$('marketAsOf').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);if(tab==='paper')drawChart();if(tab==='market'){ $('connectorProvider').value=selectedConnector;restoreConnector();refreshFeedChoices();}}
function comparisonFeeds(feeds){const latest=new Map();for(const f of feeds)latest.set(JSON.stringify([f.provider,f.symbol,f.price_basis]),f);return [...latest.values()];}
function refreshFeedChoices(){if(!$('feedA'))return;const feeds=comparisonFeeds(state.operations.feeds),left=feeds.find(f=>f.id===$('feedA').value),old=$('feedB').value;const candidates=left?feeds.filter(f=>f.provider!==left.provider&&f.symbol===left.symbol):[];$('feedB').innerHTML=candidates.length?options(candidates,f=>`${f.provider} · ${f.symbol} · ${f.cutoff}`):'<option value="">다른 공급원 데이터가 필요합니다</option>';if(candidates.some(f=>f.id===old))$('feedB').value=old;$('compare').disabled=busy||!candidates.length;$('comparisonHelp').textContent=candidates.length?'서로 다른 공급원의 데이터를 비교합니다.':'비교할 다른 공급원 데이터가 없습니다. 한국투자를 여러 번 갱신해도 두 공급원 검증은 할 수 없습니다. 다른 공급원의 정상적인 CSV나 연결이 필요합니다.';}
function restoreConnector(){const config=(state.connectors||[]).find(c=>c&&c.provider===$('connectorProvider').value);$('connectorSymbol').value=config?.symbol||'SOXL';const yahoo=$('connectorProvider').value==='yahoo';$('connectorBasis').value=yahoo?'split-adjusted':config?.price_basis||'';$('connectorBasis').disabled=yahoo;$('connectorTerms').checked=!!config?.license_confirmed;$('connectorHelp').innerHTML=yahoo?'Yahoo의 최근 1년 일봉을 가져옵니다. 추가 키는 필요 없습니다. 분할 조정 OHLC를 사용하며 배당 조정 종가는 섞지 않습니다. 공식 보장 API가 아니므로 차단·변경될 수 있습니다. <a href="https://legal.yahoo.com/us/en/yahoo/terms/otos/index.html" target="_blank" rel="noopener noreferrer">이용 조건 확인</a> 후 아래 확인란에 체크하세요.':$('connectorProvider').value==='stooq'?'Stooq는 브라우저 확인으로 자동 조회가 막힐 수 있습니다. 연결 중지 버튼으로 예약 수집에서 제외할 수 있습니다.':'한국투자에 저장된 키로 일봉을 조회합니다.';}
function bind(){if($('feedA'))$('feedA').onchange=refreshFeedChoices;const on=(id,fn)=>{if($(id))$(id).onclick=()=>task(fn);};on('refresh',async()=>{notify('상태를 갱신했습니다.');});
on('saveSettings',async()=>{const values={PL_GEMINI_MODEL:$('globalModel').value.trim(),PL_MONTHLY_BUDGET_KRW:$('budget').value,PL_INPUT_KRW_PER_MILLION:$('inputRate').value,PL_OUTPUT_KRW_PER_MILLION:$('outputRate').value};if((values.PL_INPUT_KRW_PER_MILLION==='0'||values.PL_OUTPUT_KRW_PER_MILLION==='0')&&!$('freeConfirmed').checked)throw Error('단가 0을 쓰려면 실제 무료 자격 확인을 체크하세요.');document.querySelectorAll('[data-public]').forEach(e=>values[e.dataset.public]=e.value);const keys={};state.settings.roles.forEach(r=>{const key=$('key-'+r.role).value;if(key)keys[r.role]=key;});if($('kisKey').value)keys.KIS_APPKEY=$('kisKey').value;if($('kisSecret').value)keys.KIS_APPSECRET=$('kisSecret').value;const delete_keys=[...document.querySelectorAll('[data-delete]:checked')].map(e=>e.dataset.delete);await api('/api/app/settings',{values,keys,delete_keys});document.querySelectorAll('input[type=password]').forEach(e=>e.value='');notify('설정과 키를 저장했습니다. 키는 다시 표시하지 않습니다. 모델 목록 조회와 실제 회의를 이어서 확인하세요.');});
on('models',async()=>{const d=await api('/api/app/models',{role:$('modelRole').value});$('modelOptions').replaceChildren(...d.models.map(m=>{const o=document.createElement('option');o.value=m;return o;}));$('modelSelect').replaceChildren(...['',...d.models].map(m=>{const o=document.createElement('option');o.value=m;o.textContent=m||'사용할 모델을 선택하세요';return o;}));$('modelsMessage').textContent=`${d.models.length}개 모델 목록 확인. 조회된 모델 선택에서 고른 뒤 설정·키 저장을 누르세요.`;notify('모델 목록을 불러왔습니다. 실제 생성 호출은 아직 실행하지 않았습니다.');return false;});
on('saveKis',async()=>{const keys={};if($('kisKey').value.trim())keys.KIS_APPKEY=$('kisKey').value.trim();if($('kisSecret').value.trim())keys.KIS_APPSECRET=$('kisSecret').value.trim();if(!Object.keys(keys).length)throw Error('새 키를 입력하지 않았습니다. 등록됨으로 표시되면 이미 저장되어 있습니다. 인증 확인 버튼을 누르세요.');await api('/api/app/settings',{keys});$('kisKey').value='';$('kisSecret').value='';notify('한국투자 키를 저장했습니다. 입력칸이 비워지는 것은 정상입니다. 저장된 한국투자 키로 인증 확인을 눌러주세요.');});
on('checkKis',async()=>{if($('kisKey').value||$('kisSecret').value)throw Error('입력 중인 키가 있습니다. 먼저 한국투자 키만 저장을 누르세요.');const r=await api('/api/app/kis/check',{});notify(r.message);});
if($('modelSelect'))$('modelSelect').onchange=()=>{if($('modelSelect').value){$('globalModel').value=$('modelSelect').value;notify('모델을 선택했습니다. 설정·키 저장을 눌러 적용하세요.');}};
if($('saveSettingsTop'))$('saveSettingsTop').onclick=()=>$('saveSettings').click();
on('resetStore',async()=>{if(!$('resetStoreConfirmed').checked)throw Error('원본 보존·초기화를 먼저 확인하세요.');await api('/api/app/settings/recover',{confirmed:true});notify('암호화 원본을 recovery 폴더에 보존하고 연결 설정을 초기화했습니다.');});
on('emergencyStop',async()=>{await api('/api/app/emergency',{enabled:true,reason:$('emergencyReason').value});notify('긴급 중지했습니다. 현재 처리 중인 한 요청의 응답은 도착할 수 있습니다.');});on('emergencyResume',async()=>{await api('/api/app/emergency',{enabled:false,reason:'operator_pause'});notify('중지를 해제했습니다. 자동 회의·연결 설정을 다시 확인하세요.');});
on('saveSchedule',async()=>{await api('/api/app/schedule',{enabled:$('scheduleEnabled').checked,symbol:$('scheduleSymbol').value});notify('일일 회의 설정을 저장했습니다. 서버 실행 중에만 작동합니다.');});on('tick',async()=>{const r=await api('/api/app/schedule/tick',{});notify(JSON.stringify(r,null,2));});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>task(async()=>{await api('/api/app/meeting/cancel',{run_id:b.dataset.cancel});notify('회의 중단을 요청했습니다. 진행 중인 한 요청의 응답은 도착할 수 있습니다.');}));
if($('connectorProvider'))$('connectorProvider').onchange=()=>{selectedConnector=$('connectorProvider').value;restoreConnector();};
on('disableConnector',async()=>{const saved=(state.connectors||[]).find(c=>c&&c.provider===$('connectorProvider').value);if(!saved)throw Error('등록된 연결이 없습니다.');await api('/api/app/connector/config',{...saved,enabled:false});notify('이 공급원의 자동 수집을 중지했습니다. 기존 데이터와 키는 유지됩니다.');});on('enableConnector',async()=>{await api('/api/app/connector/config',{provider:$('connectorProvider').value,enabled:true,symbol:$('connectorSymbol').value,price_basis:$('connectorBasis').value,license_confirmed:$('connectorTerms').checked});notify('공급원을 활성화했습니다. 갱신 버튼으로 실제 연결을 확인하세요.');});on('fetchConnector',async()=>{const provider=$('connectorProvider').value;const saved=(state.connectors||[]).find(c=>c&&c.provider===provider);if(!saved?.enabled)throw Error('먼저 가격 기준과 이용 조건을 확인하고 공급원 등록·활성화를 누르세요.');if($('connectorSymbol').value.trim().toUpperCase()!==saved.symbol||$('connectorBasis').value!==saved.price_basis||$('connectorTerms').checked!==saved.license_confirmed)throw Error('화면의 설정이 저장된 연결과 다릅니다. 먼저 공급원 등록·활성화를 눌러 변경사항을 저장하세요.');const r=await api('/api/app/connector/fetch',{provider});notify('공급원 데이터 저장: '+r.provider+' · '+r.cutoff);});on('importMarket',async()=>{const f=await fileData('marketFile');const r=await api('/api/app/market/csv',{...f,metadata:{provider:$('marketProvider').value,symbol:$('marketSymbol').value,synthetic:false,price_basis:$('marketBasis').value,asof:new Date($('marketAsOf').value).toISOString(),license_confirmed:$('marketTerms').checked,splits:JSON.parse($('splits').value)}});notify('원본과 시세 피드를 저장했습니다: '+r.cutoff);});on('compare',async()=>{const left=state.operations.feeds.find(f=>f.id===$('feedA').value),right=state.operations.feeds.find(f=>f.id===$('feedB').value);if(!left||!right||left.provider===right.provider)throw Error('서로 다른 공급원의 데이터가 먼저 필요합니다.');const r=await api('/api/app/market/compare',{left:$('feedA').value,right:$('feedB').value});notify(r.passed?'출처 확인·가격 정합성 정책을 통과했습니다.':'승인 보류: '+r.issues.join(' / '));});
on('queuePaper',async()=>{const r=await api('/api/app/paper/queue',{run_id:$('paperRun').value,conditions_checked:$('conditionsChecked').checked});notify(r.due_date+' 익일 시가 모의 주문을 접수했습니다.');});on('settle',async()=>{const r=await api('/api/app/paper/settle',{snapshot_id:$('settleSnapshot').value});notify(r.processed+'거래일의 모의 현금·수량·자산을 정산했습니다.');});
on('importLedger',async()=>{const r=await api('/api/app/ledger/import',await fileData('ledgerFile'));notify(`원본 보존 완료 · ${r.accepted}건 · 오류/검토 후보 ${r.issues.length}건`);});on('previewMigration',async()=>{const r=await api('/api/app/migration/preview',await fileData('migrationFile'));notify('드라이런 대조 완료. 결과를 확인한 뒤 이관 확정하세요. 원본은 보존됩니다.');});document.querySelectorAll('[data-migrate]').forEach(b=>b.onclick=()=>task(async()=>{await api('/api/app/migration/commit',{source:b.dataset.migrate});notify('드라이런 결과를 감사 원장으로 이관 확정했습니다. 브라우저 원본을 지우지 않았습니다.');}));document.querySelectorAll('[data-ledger-review]').forEach(b=>b.onclick=()=>task(async()=>{const key=b.dataset.ledgerReview,resolutions={};$('review-'+key).querySelectorAll('[data-review]').forEach(e=>resolutions[e.dataset.review]=e.value);await api('/api/app/ledger/review',{ledger_id:key,resolutions});notify('검토 결과를 새 원장 버전에 기록했습니다. 원본은 보존됩니다.');}));document.querySelectorAll('[data-confirm-ledger]').forEach(b=>b.onclick=()=>task(async()=>{const key=b.dataset.confirmLedger;await api('/api/app/ledger/confirm',{ledger_id:key,positions:JSON.parse($('refs-'+key).value),total_fees:$('fees-'+key).value,total_taxes:$('taxes-'+key).value,full_history_confirmed:$('full-'+key).checked,independent_calculation_confirmed:$('independent-'+key).checked});notify('사용자 확인 전체 원장·증권사 대조를 기록했습니다.');}));
on('freezeRules',async()=>{await api('/api/app/promotion/rules',{minimum_samples:Number($('reviewSamples').value),minimum_months:Number($('reviewMonths').value),minimum_regimes:Number($('reviewRegimes').value),horizon:Number($('reviewHorizon').value)});notify('향후 평가에 적용할 기준 버전을 고정했습니다.');});on('reviewNow',async()=>{const r=await api('/api/app/promotion/review',{rule_id:$('reviewRule').value});notify(r.status==='recommended'?'승격 권고가 생성되었습니다. 근거를 확인하세요.':'심사 유예: '+r.reasons.join(' / '));});document.querySelectorAll('[data-promote]').forEach(b=>b.onclick=()=>task(async()=>{await api('/api/app/promotion/apply',{review_id:b.dataset.promote});notify('승격 검토 결과를 향후 전략 프로필에 적용했습니다. 과거 버전은 보존됩니다.');}));
document.querySelectorAll('[data-promote-leader]').forEach(b=>b.onclick=()=>task(async()=>{await api('/api/app/promotion/apply',{review_id:b.dataset.promoteLeader,leader_team:b.dataset.team});notify('후보의 판단·수량 정책을 향후 회의의 활성 팀장으로 적용했습니다.');}));
on('backup',async()=>{const r=await api('/api/app/backup/create',{});notify('백업 생성 완료: '+r.name);});on('replay',async()=>{const r=await api('/api/app/replay',{});notify('해시·원장 재생 검사: '+(r.audit.valid?'통과':'실패')+' · '+r.audit.events+'이벤트');});if($('restoreFile'))$('restoreFile').onchange=()=>{restoreContent='';lastDryRun=null;$('restorePreview').innerHTML='';$('restoreConfirmed').checked=false;};
on('inspectBackup',async()=>{const f=await fileData('restoreFile',100000000);restoreContent=f.content;lastDryRun=await api('/api/app/backup/restore',{content:f.content,confirm:false});$('restorePreview').innerHTML=jsonDetails('복원 전 검사 결과',lastDryRun);notify('백업 파일·해시·SQLite 검사를 통과했습니다.');return false;});on('restore',async()=>{if(!restoreContent||!lastDryRun||!$('restoreConfirmed').checked)throw Error('먼저 같은 복원 파일을 검사하고 복원 확인을 체크하세요.');const r=await api('/api/app/backup/restore',{content:restoreContent,confirm:true});restoreContent='';lastDryRun=null;notify('복원 완료. 변경 전 백업: '+r.before_restore_backup);});}
function drawChart(){const marks=state.operations.portfolio.marks;if(!marks.length){$('equityChart').textContent='정산 후 일별 자산 추이가 표시됩니다.';return;}const colors={A:'#185c4b',B:'#4d77a7',C:'#a78430',D:'#a55c72',BUY_HOLD:'#888'};const values=marks.flatMap(m=>Object.keys(colors).map(t=>m.books[t].equity));let lo=Math.min(10000,...values),hi=Math.max(10000,...values);if(hi===lo)hi=lo+1;const polylines=Object.entries(colors).map(([t,color])=>`<polyline fill="none" stroke="${color}" stroke-width="2" points="${marks.map((m,i)=>`${20+i/Math.max(1,marks.length-1)*960},${165-(m.books[t].equity-lo)/(hi-lo)*145}`).join(' ')}"/>`).join('');$('equityChart').innerHTML=`<svg viewBox="0 0 1000 180" role="img" aria-label="모의 원장의 일별 자산: A 녹색, B 파랑, C 금색, D 분홍, 단순 보유 회색">${polylines}</svg>`;}
document.querySelectorAll('[data-tab]').forEach(b=>{b.disabled=true;b.onclick=()=>{if(busy||!state)return;tab=b.dataset.tab;notify('');render();};});load().then(()=>{if(!state.ai.configuration.ready){tab='settings';render();}document.querySelectorAll('[data-tab]').forEach(b=>b.disabled=false);}).catch(e=>notify(e.message,true));
</script></body></html>
